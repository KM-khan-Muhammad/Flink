<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Neon Stroke Gradient (Cyan to Purple) -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#b026ff"/>
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glass Bubble Effect -->
    <radialGradient id="glassReflection" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
  </defs>

  <!-- Dark Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- The Glowing F Letter / Lightning -->
  <!-- We'll draw an F that incorporates a lightning bolt -->
  <path d="M 120 50 L 70 50 L 50 110 L 90 110 L 80 160 L 140 90 L 100 90 L 110 50 Z" 
        fill="none" 
        stroke="url(#neonGrad)" 
        stroke-width="8" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Stroke to make it pop -->
  <path d="M 120 50 L 70 50 L 50 110 L 90 110 L 80 160 L 140 90 L 100 90 L 110 50 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-linejoin="round"/>

  <!-- Glass Bubble Reflection over the whole thing -->
  <circle cx="100" cy="100" r="95" fill="url(#glassReflection)"/>
</svg>
